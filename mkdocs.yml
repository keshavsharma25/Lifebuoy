site_name: Lifebuoy
site_url: https://keshav0x.github.io/lifebuoy
theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.indexes
    - search.suggest
    - content.tabs.link
    - content.tooltips
nav:
  - "Home":
    - "Home" : index.md
    - "Timeline": timeline.md
    - "Role of a sequencer": sequencer.md
    - "The Bottleneck": bottleneck.md
    - "Forced Inclusion": forced-inclusion.md
    - "Walkaway Test": walkaway-test.md
    - "Comparison": comparison.md
    - "What's next": why-not-enough.md
  - "OP Stack":
    - "OP Stack": op-stack/index.md
    - "All there is to know about OP Stack": op-stack/features.md
    - "Transaction Lifecycle": op-stack/transaction-lifecycle.md
    - "Deposit Transaction": op-stack/deposit-transaction.md
    - "Withdrawals": op-stack/withdrawals.md
    - "Implementation": op-stack/implementation.md
  - "Nitro Stack":
    - "Nitro Stack": nitro-stack/index.md
  - "Scroll":
    - "Scroll": scroll/index.md
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      auto_append:
        - glossary/index.md
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  -  pymdownx.critic
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - abbr
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
extra_css:
  - stylesheets/extra.css
watch:
  - glossary
